<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sākums - Sociālās rehabilitācijas sistēma</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f0a1e 0%, #151025 100%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Inter, sans-serif;">
    <div style="text-align: center; padding: 40px;">
        <h1 style="font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #f8fafc 0%, #c084fc 50%, #f472b6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px;">Sociālās rehabilitācijas sistēma</h1>
        <p style="color: #e2e8f0; font-size: 18px; margin-bottom: 8px;">Pieteikšanās veiksmīga!</p>
        <p style="color: #cbd5e1;">Administrators (D001)</p>
        <button onclick="logout()" style="margin-top: 32px; padding: 12px 24px; background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-family: Inter, sans-serif; font-weight: 600;">Iziet</button>
    </div>
    <script>
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
