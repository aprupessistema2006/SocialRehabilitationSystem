<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieteikšanās sistēmā - Sociālās rehabilitācijas sistēma</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="32" height="32" rx="8" fill="url(#grad1)"/>
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M16 8L8 12V24H12V18H20V24H24V12L16 8Z" fill="white"/>
                    </svg>
                </div>
                <h1 class="login-title">Sociālās rehabilitācijas sistēma</h1>
                <p class="login-subtitle">Piekļuves pārbaude</p>
            </div>
            
            <div id="accessGate">
                <div class="form-group">
                    <label for="accessPassword" class="form-label">Kopējā piekļuves parole</label>
                    <input type="password" id="accessPassword" class="form-input" placeholder="Ievadiet paroli" autocomplete="off">
                </div>
                <button type="button" class="btn btn-primary btn-full" id="accessBtn">Turpināt</button>
                <div id="accessError" class="error-message" style="display: none; margin-top: 16px;">
                    Nepareiza piekļuves parole
                </div>
            </div>
            
            <div id="pinGate" style="display: none;">
                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="pin" class="form-label">PIN kods (Administrators)</label>
                        <input type="password" id="pin" class="form-input" maxlength="6" placeholder="Ievadiet PIN" autocomplete="off" inputmode="numeric">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Pieteikties</button>
                </form>
                <div id="loginError" class="error-message" style="display: none;">
                    Nepareizs PIN kods vai konts nav aktīvs
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
