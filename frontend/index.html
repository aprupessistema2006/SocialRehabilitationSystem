<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociālās rehabilitācijas sistēma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>Sociālās rehabilitācijas sistēma</h1>
            <p>Lūdzu, pieteikties</p>
            <div id="loginError" class="error-message" style="display:none;"></div>
            <button onclick="doLogin()">Pieteikties</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="app-header">
            <div class="header-left">
                <h2>Sociālās rehabilitācijas sistēma</h2>
            </div>
            <div class="header-right">
                <span id="userName"></span>
                <button onclick="logout()" class="btn-small">Iziet</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul id="navMenu"></ul>
        </nav>

        <main class="main-content">
            <div id="content"></div>
        </main>

        <div id="toast" class="toast"></div>
    </div>

    <script src="app.js"></script>
    <script src="form.js"></script>
    <script src="cascade.js"></script>
    <script src="history.js"></script>
    <script src="admin.js"></script>
</body>
</html>
